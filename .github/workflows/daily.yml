name: Daily carousel
on:
  schedule: [{ cron: "0 6 * * *" }]   # 06:00 UTC daily - change to suit
  workflow_dispatch:
permissions: { contents: write }
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/generate.py
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}", SLIDES_PER_POST: "5" }
      - name: Commit images (so Slack can display them)
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add queue && git commit -m "queue $(date -u +%F)" && git push
      - run: python scripts/notify.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          APPROVE_SECRET: ${{ secrets.APPROVE_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
