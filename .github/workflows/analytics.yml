name: Weekly performance report
on:
  schedule: [{ cron: "0 7 * * 1" }]   # Mondays 07:00 UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/analytics.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add queue/insights.json && (git commit -m "insights $(date -u +%F)" && git push) || echo "no changes"
