name: Publish approved carousel
on:
  workflow_dispatch:
    inputs: { date: { description: "YYYY-MM-DD", required: true } }
permissions: { contents: write }
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/publish.py "${{ inputs.date }}"
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_BASE: https://graph.facebook.com/v26.0
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add queue && git commit -m "posted ${{ inputs.date }}"
          git pull --rebase origin main
          git push
